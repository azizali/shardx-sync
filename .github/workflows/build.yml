name: Build and release

# Push a tag like v1.2.0 to build every installer and publish them as a GitHub Release.
# Run it by hand (Actions > Build and release > Run workflow) to build without releasing.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  WAILS_VERSION: v2.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # setup-go caches downloaded modules, not compiled packages. Cache the build cache too,
      # so the large pure-Go sqlite driver is not recompiled on every run.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(jq -r .info.productVersion wails.json | tr -d '\r')"; fi
          # Installer metadata needs a plain X.Y.Z (the Windows installer rejects "2.0" or "1.2.3-beta").
          # v2.0 -> 2.0.0, v1.2.3-beta.1 -> 1.2.3. File names keep the tag as written.
          NUM="${V%%[-+]*}"
          IFS=. read -r a b c extra <<< "$NUM"
          b=${b:-0}; c=${c:-0}
          if ! [[ "$a" =~ ^[0-9]+$ && "$b" =~ ^[0-9]+$ && "$c" =~ ^[0-9]+$ && -z "$extra" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version. Use tags like v1.2.0 or v1.2.0-beta.1."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version $V, installer version $a.$b.$c"
          # The app bundle and installer metadata read the version from wails.json.
          jq --arg v "$a.$b.$c" '.info.productVersion = $v' wails.json | tr -d '\r' > wails.tmp && mv wails.tmp wails.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - run: go test ./...

      - name: Build macOS (universal)
        if: runner.os == 'macOS'
        run: |
          V=${{ steps.v.outputs.version }}
          wails build -platform darwin/universal -clean -ldflags "-X main.version=$V"
          mkdir -p dist dmg && cp -R "build/bin/ShardX Sync.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "ShardX Sync" -srcfolder dmg -ov -format UDZO "dist/ShardX-Sync-$V-mac-universal.dmg"

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          V=${{ steps.v.outputs.version }}
          command -v makensis || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform windows/amd64 -nsis -clean -ldflags "-X main.version=$V"
          mkdir -p dist
          cp build/bin/shardx-sync.exe "dist/ShardX-Sync-$V-win-x64-portable.exe"
          cp build/bin/*installer.exe "dist/ShardX-Sync-$V-win-x64-setup.exe"

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          V=${{ steps.v.outputs.version }}
          wails build -platform linux/amd64 -tags webkit2_41 -clean -ldflags "-X main.version=$V"
          mkdir -p dist
          tar -czf "dist/ShardX-Sync-$V-linux-x64.tar.gz" -C build/bin shardx-sync
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          VERSION=$V nfpm package -p deb -f build/linux/nfpm.yaml -t dist/
          mv dist/shardx-sync_*_amd64.deb "dist/ShardX-Sync-$V-linux-amd64.deb"

      - run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - run: ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
